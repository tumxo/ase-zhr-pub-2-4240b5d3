# Tests laufen gegen eine frische In-Memory-H2 ohne Seed-Daten.
# DATABASE_TO_LOWER=TRUE wie im Betrieb: unquotierte DDL-Namen klein speichern,
# passend zum jOOQ-Codegen (defaultNameCase=lower).
spring.datasource.url=jdbc:h2:mem:calvin-test;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jooq.sql-dialect=H2

# Nur das Schema migrieren – keine Seed-Daten in Tests.
spring.flyway.locations=classpath:db/migration

cors.allowed-origins=http://localhost:5173
