spring.application.name=booking-service
# Port 8080 ist in der Trainings-Umgebung von code-server (VS Code im Browser) belegt.
server.port=8081
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# H2 dateibasiert (ADR-001): persistiert zwischen Neustarts unter ./data/calvin.
# DATABASE_TO_LOWER=TRUE: unquotierte DDL-Namen werden klein gespeichert, passend
# zum jOOQ-Codegen (defaultNameCase=lower), der klein-quotierte Bezeichner rendert.
spring.datasource.url=jdbc:h2:file:./data/calvin;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# jOOQ nutzt den H2-Dialekt.
spring.jooq.sql-dialect=H2

# Flyway: Schema (migration) + Seed-Daten (seed) für den laufenden Betrieb.
spring.flyway.locations=classpath:db/migration,classpath:db/seed
